<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 110" width="100%" height="100%" fill="none">
  <defs>
    <!-- Crimson flame gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A50E24" />
      <stop offset="60%" stop-color="#C8102E" />
      <stop offset="100%" stop-color="#E52D42" />
    </linearGradient>

    <!-- Green lotus leaf gradients -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#08492C" />
      <stop offset="60%" stop-color="#0B5D3B" />
      <stop offset="100%" stop-color="#147E51" />
    </linearGradient>

    <!-- Gold accent gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2BE60" />
      <stop offset="50%" stop-color="#C9A24B" />
      <stop offset="100%" stop-color="#A27D26" />
    </linearGradient>
  </defs>

  <!-- EMBLEM ICON (Left) -->
  <g transform="translate(10, 8)">
    <!-- Subtle gold aura halo -->
    <circle cx="45" cy="45" r="42" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.45" />

    <!-- Three Lotus Leaves -->
    <!-- Left Leaf -->
    <path d="M 45 68 C 29 67, 12 55, 18 39 C 24 37, 38 48, 45 68 Z" fill="url(#leafGrad)" stroke="#063620" stroke-width="0.8" />
    <!-- Right Leaf -->
    <path d="M 45 68 C 61 67, 78 55, 72 39 C 66 37, 52 48, 45 68 Z" fill="url(#leafGrad)" stroke="#063620" stroke-width="0.8" />
    <!-- Center Leaf -->
    <path d="M 45 72 C 32 60, 31 46, 45 37 C 59 46, 58 60, 45 72 Z" fill="url(#leafGrad)" stroke="#063620" stroke-width="0.8" />
    <path d="M 45 70 L 45 40" stroke="#86EFAC" stroke-width="1" opacity="0.6" stroke-linecap="round" />

    <!-- Red Flame Bud (Heart / Spire shape) -->
    <path d="M 45 8 C 49 20, 60 28, 56 39 C 53.5 46, 47 50, 45 50 C 43 50, 36.5 46, 34 39 C 30 28, 41 20, 45 8 Z" 
          fill="url(#flameGrad)" stroke="#89091C" stroke-width="0.75" />
    
    <!-- Heart-shaped flame inner cutout -->
    <path d="M 45 20 C 47.5 27, 52 32, 50 38 C 48.5 42, 45 44, 45 44 C 45 44, 41.5 42, 40 38 C 38 32, 42.5 27, 45 20 Z" 
          fill="#FFF1F2" opacity="0.95" />
    <!-- Inner red spark -->
    <circle cx="45" cy="34" r="3.5" fill="#C8102E" />
  </g>

  <!-- TEXT BRANDING (Right) -->
  <g transform="translate(108, 2)">
    <!-- Line 1: SOLUTION in bold green -->
    <text x="0" y="32" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="28" font-weight="900" fill="#0B5D3B" letter-spacing="2">
      SOLUTION
    </text>

    <!-- Line 2: SPIRITUAL in crimson red -->
    <text x="0" y="55" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#C8102E" letter-spacing="4">
      SPIRITUAL
    </text>

    <!-- Line 3: HEALING / PRAYER in green -->
    <text x="0" y="74" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0B5D3B" letter-spacing="2.5">
      HEALING / PRAYER
    </text>

    <!-- Hairline divider -->
    <line x1="0" y1="82" x2="360" y2="82" stroke="url(#goldGrad)" stroke-width="1" opacity="0.7" />

    <!-- Line 4: Arabic "حلول الشفاء والدعاء" -->
    <text x="0" y="100" font-family="'Amiri', 'Traditional Arabic', serif" font-size="16" font-weight="700" fill="#1E2A24" letter-spacing="0.5">
      حلول الشفاء و الدعاء
    </text>

    <!-- Tagline on right -->
    <text x="360" y="100" text-anchor="end" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="11" font-weight="500" fill="#C9A24B">
      Faith • Hope • Healing
    </text>
  </g>
</svg>
