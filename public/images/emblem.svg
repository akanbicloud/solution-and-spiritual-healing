  <!-- Flame-Bud -->
  <path d="M 50 16 C 53.5 27, 62 35, 59 46 C 57 53, 50 57, 50 57 C 50 57, 43 53, 41 46 C 38 35, 46.5 27, 50 16 Z" fill="url(#flameGrad)" />
