  <circle cx="50" cy="50" r="46" fill="#FBF8F1" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="50" cy="50" r="42" stroke="#0B5D3B" stroke-width="0.75" opacity="0.4" stroke-dasharray="2 2" />

